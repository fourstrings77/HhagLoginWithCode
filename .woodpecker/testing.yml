clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      path: ./plugin/
steps:
  - name: phpunit
    image: docker
    commands:
      - pwd
      - ls -asl ./plugin
      - docker run --rm -d -v ./plugin/:/var/www/html/custom/plugins/HhagLoginWithCode/ --name shopware_2 dockware/dev:latest
      - docker exec -ti shopware_2 /var/www/html/vendor/bin/phpunit -c /var/www/html/custom/plugins/HhagLoginWithCode/phpunit.xml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock