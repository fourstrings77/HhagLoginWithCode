clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      path: ./plugin/
steps:
  - name: phpunit
    image: docker
    commands:
      - pwd
      - ls -asl ./plugin
      - docker run --rm -p 80:80 -v ./plugin/:/var/www/html/custom/plugins/HhagLoginWithCode/ dockware/dev:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock