clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      path: ./plugin/
steps:
  - name: phpunit
    image: docker
    commands:
      - docker run --rm -d --name shopware_4 dockware/dev:latest
      - docker exec shopware_4 mkdir -p /var/www/html/custom/plugins/HhagLoginWithCode
      - docker cp plugin/. shopware_4:/var/www/html/custom/plugins/HhagLoginWithCode/.
      - docker exec shopware_4 /var/www/html/vendor/bin/phpunit -c /var/www/html/custom/plugins/HhagLoginWithCode/phpunit.xml
      - docker container stop $(docker container ls -q --filter name=shopware_)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock