clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      path: ./plugin/
steps:
  - name: phpunit
    image: docker
    commands:
      - pwd
      - ls -asl ./plugin
      - docker stop
      - docker run --rm -d -p 91:80 -v ./plugin/:/var/www/html/custom/plugins/HhagLoginWithCode/ dockware/dev:latest
      - docker exec /var/www/html/vendor/bin/phpunit -c /var/www/html/custom/plugins/HhagLoginWithCode/phpunit.xml
      - docker stop
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock