clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      path: ./plugin/
steps:
  - name: phpstan
    image: docker
    commands:
      - docker container stop $(docker container ls -q --filter name=shopware)
      - docker run --rm -d --name shopware dockware/dev:latest
      - docker exec shopware mkdir -p /var/www/html/custom/plugins/HhagLoginWithCode
      - docker cp plugin/. shopware:/var/www/html/custom/plugins/HhagLoginWithCode/.
      - docker exec shopware cd /var/var/www/html/custom/plugins/HhagLoginWithCode && composer update && /var/www/html/custom/plugins/HhagLoginWithCode/vendor/bin/phpstan
      #- docker exec shopware /var/www/html/vendor/bin/phpunit -c /var/www/html/custom/plugins/HhagLoginWithCode/phpunit.xml

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock